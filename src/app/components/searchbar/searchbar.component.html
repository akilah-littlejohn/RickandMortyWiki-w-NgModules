<section class="searchbar-wrapper">
  <form #searchbar>
    <input
      type="search"
      placeholder="Enter Character Here...."
      #search
      (keyup)="searchByName(search.value, pageNumber())"
    />
    <button type="submit">Search</button>
  </form>
</section>

@for (character of searchedCharacters(); track character.id) {
  <app-char-card [characterInfo]="character" />
}
